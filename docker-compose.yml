services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: portfolio, POSTGRES_PASSWORD: portfolio, POSTGRES_DB: portfolio }
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL","pg_isready -U portfolio"], interval: 5s, retries: 10 }
  web:
    build: .
    ports: ["3000:3000"]
    depends_on: { db: { condition: service_healthy } }
    # Local: uses the db service. Neon: set DATABASE_URL in .env and it overrides this default.
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://portfolio:portfolio@db:5432/portfolio}
volumes: { pgdata: {} }
